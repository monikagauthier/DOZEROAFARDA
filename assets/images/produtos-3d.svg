<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-label="Mockups do curso">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15385f"/>
      <stop offset="1" stop-color="#0a1c33"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132a47"/>
      <stop offset="1" stop-color="#081628"/>
    </linearGradient>
    <linearGradient id="blueFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7be4"/>
      <stop offset="1" stop-color="#17406f"/>
    </linearGradient>
    <radialGradient id="pGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#2f7be4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2f7be4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="560" height="420" fill="url(#pGlow)"/>

  <!-- notebook -->
  <g transform="translate(40,150)">
    <rect x="0" y="0" width="240" height="150" rx="10" fill="#0c1b30" stroke="#20426e"/>
    <rect x="12" y="12" width="216" height="126" rx="4" fill="url(#screen)"/>
    <rect x="-18" y="150" width="276" height="16" rx="6" fill="#16304f"/>
    <rect x="30" y="30" width="120" height="8" rx="4" fill="#3f7fd6" opacity="0.7"/>
    <rect x="30" y="48" width="170" height="6" rx="3" fill="#2a4e7d" opacity="0.7"/>
    <rect x="30" y="62" width="150" height="6" rx="3" fill="#2a4e7d" opacity="0.7"/>
    <rect x="30" y="90" width="90" height="26" rx="6" fill="#2f7be4"/>
  </g>

  <!-- caixa do produto (box 3D) -->
  <g transform="translate(300,70)">
    <path d="M0 40 L90 0 L170 30 L80 72 Z" fill="#1a3a60"/>
    <path d="M0 40 L80 72 L80 250 L0 220 Z" fill="url(#box)"/>
    <path d="M80 72 L170 30 L170 210 L80 250 Z" fill="url(#blueFace)"/>
    <text x="125" y="130" text-anchor="middle" font-family="Montserrat, Arial" font-weight="900" font-size="15" fill="#ffffff" transform="skewY(-16)">DO ZERO</text>
    <text x="125" y="152" text-anchor="middle" font-family="Montserrat, Arial" font-weight="900" font-size="15" fill="#cfe2ff" transform="skewY(-16)">À FARDA</text>
    <text x="125" y="176" text-anchor="middle" font-family="Montserrat, Arial" font-weight="900" font-size="20" fill="#ffffff" transform="skewY(-16)">PMRJ</text>
  </g>

  <!-- smartphone -->
  <g transform="translate(410,210)">
    <rect x="0" y="0" width="90" height="180" rx="16" fill="#0c1b30" stroke="#20426e"/>
    <rect x="7" y="10" width="76" height="160" rx="10" fill="url(#screen)"/>
    <rect x="18" y="26" width="54" height="8" rx="4" fill="#3f7fd6"/>
    <rect x="18" y="46" width="40" height="5" rx="2" fill="#2a4e7d"/>
    <rect x="18" y="70" width="54" height="34" rx="6" fill="#123457"/>
    <rect x="18" y="116" width="54" height="34" rx="6" fill="#123457"/>
  </g>

  <!-- apostilas empilhadas -->
  <g transform="translate(70,330)">
    <rect x="0" y="20" width="170" height="20" rx="4" fill="#1b3961"/>
    <rect x="8" y="6" width="170" height="20" rx="4" fill="#24507f"/>
    <rect x="16" y="-8" width="170" height="20" rx="4" fill="#2f7be4"/>
  </g>
</svg>
